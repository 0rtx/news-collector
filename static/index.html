<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>实时快讯 · 重要消息</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📡</span>
      <div>
        <h1>实时快讯 · 重要消息</h1>
        <div class="sub">财联社电报（按阅读量） · 新浪 7×24</div>
      </div>
    </div>
    <div class="top-right">
      <button id="refresh-btn" class="refresh-btn"><span class="r-arrow">↻</span> 刷新</button>
      <button id="fav-toggle" class="fav-toggle">★ 收藏 <span class="count" id="fav-count">0</span></button>
      <div class="status-pill" id="connection">连接中…</div>
      <div class="clock" id="clock">--:--:--</div>
    </div>
  </header>

  <section class="markets">
    <div class="market" id="mkt-cn">A股 <b>--</b></div>
    <div class="market" id="mkt-hk">港股 <b>--</b></div>
    <div class="market" id="mkt-us">美股 <b>--</b></div>
  </section>

  <main>
    <section class="panel important-panel">
      <div class="panel-head">
        <h2>重要消息</h2>
        <span class="badge">按阅读量 · 保留24小时</span>
        <span class="updated" id="cls-updated">--</span>
      </div>
      <div class="important" id="important"></div>
    </section>

    <section class="panel news-panel">
      <div class="panel-head">
        <h2>7×24 快讯</h2>
        <span class="updated" id="news-updated">--</span>
      </div>
      <div class="news" id="news"></div>
    </section>

  </main>

  <footer>
    数据来源：财联社电报（阅读量）· 新浪财经 7×24。免费公开接口可能存在延迟或波动，内容仅供信息参考，不构成投资建议。
  </footer>

  <div class="drawer-overlay" id="drawer-overlay"></div>
  <aside class="drawer" id="fav-drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>我的收藏</h2>
      <span class="drawer-count" id="fav-count-head">0 条</span>
      <button id="clear-favs" class="ghost-btn">清空</button>
      <button id="drawer-close" class="icon-btn" title="关闭">✕</button>
    </div>
    <div class="news drawer-list" id="favs"></div>
  </aside>

  <script src="/static/app.js"></script>
</body>
</html>
